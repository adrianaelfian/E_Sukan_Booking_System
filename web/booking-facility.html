<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Facility - E-Sukan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f7fb; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Banner */
        .header-banner {
            width: 100%;
            background: #18392b;
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .header-banner h1 { font-size: 2.5rem; letter-spacing: 3px; text-transform: uppercase; }
        .header-banner p { color: #a3b899; font-size: 0.95rem; margin-top: 5px; }

        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container { 
            width: 100%;
            max-width: 500px; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0px 8px 25px rgba(0,0,0,0.05);
        }
        
        .container h2 { color: #18392b; margin-bottom: 15px; text-align: center; }

        label { display: block; font-weight: bold; margin-top: 15px; color: #333; }
        
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 0.95rem;
        }

        input:focus, select:focus { border-color: #28a745; outline: none; }
        
        /* Button Confirm */
        button { 
            background: #28a745; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            margin-top: 25px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        button:hover { background: #218838; }
        
        .btn-back { 
            display: block; 
            margin-top: 20px; 
            color: #666; 
            text-decoration: none; 
            text-align: center; 
            font-size: 0.9rem;
        }
        
        .btn-back:hover { color: #18392b; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>FACILITY RESERVATION</h1>
        <p>Book your preferred sports court and secure your slot.</p>
    </div>

    <div class="main-content">
        <div class="container">
            <h2>Book a Sport Facility</h2>
            
            <form action="#" method="post">
                
                <label>Select Facility:</label>
                <select name="facilityId" required>
                    <option value="">-- Select Court --</option>
                    <option value="1">Badminton Court A</option>
                    <option value="2">Badminton Court B</option>
                    <option value="3">Futsal Court 1</option>
                    <option value="4">Futsal Court 2</option>
                    <option value="5">Basketball Court</option>
                </select>

                <label>Booking Date:</label>
                <input type="date" name="bookingDate" required>

                <label>Select Time Slot:</label>
                <select name="timeSlot" required>
                    <option value="">-- Select Time --</option>
                    <option value="08:00">08:00 AM - 10:00 AM</option>
                    <option value="10:00">10:00 AM - 12:00 PM</option>
                    <option value="14:00">02:00 PM - 04:00 PM</option>
                    <option value="16:00">04:00 PM - 06:00 PM</option>
                    <option value="20:00">08:00 PM - 10:00 PM</option>
                </select>

                <button type="submit">Confirm Booking</button>
            </form>
            
            <a href="student-dashboard.html" class="btn-back">← Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
