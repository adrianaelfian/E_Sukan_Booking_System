<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Status - E-Sukan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fb; min-height: 100vh; }

        .header-banner { width: 100%; background: #18392b; padding: 40px 20px; text-align: center; color: white; }
        .table-container { max-width: 1000px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #18392b; color: #18392b; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        /* Status Styling */
        .status-pending { color: #f39c12; font-weight: bold; }
        .status-approved { color: #27ae60; font-weight: bold; }
        .status-rejected { color: #c0392b; font-weight: bold; }

        /* Buttons */
        .btn-approve { background: #28a745; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 0.8rem; }
        .btn-reject { background: #dc3545; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>BOOKING MANAGEMENT</h1>
        <p>Review and manage student booking requests.</p>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Equipment</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions (Manager Only)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ali bin Abu</td>
                    <td>Badminton Racket</td>
                    <td>2026-06-15</td>
                    <td class="status-pending">Pending</td>
                    <td>
                        <a href="#" class="btn-approve">Approve</a>
                        <a href="#" class="btn-reject">Reject</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
